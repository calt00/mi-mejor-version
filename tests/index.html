<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas · Mi Mejor Versión</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 20px; background: #f2f2f7; color: #111; }
    h1 { font-size: 22px; } li { margin: 4px 0; } .ok { color: #1a8f3a; } .ko { color: #d70015; font-weight: 700; }
    #resumen { font-size: 18px; font-weight: 700; margin: 12px 0; }
    pre { white-space: pre-wrap; background: #fff; padding: 8px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Pruebas de la lógica</h1>
  <div id="resumen">Ejecutando…</div>
  <ul id="lista"></ul>
  <script type="module">
    import { generarSemana } from '../js/scheduler.js';
    import { resumenMes, estadoMeta, recomendaciones, regla503020, evaluarReto } from '../js/finanzas.js';
    import { etapa, escala } from '../js/cerdito.js';
    import { miniMarkdown, toMin, addDays, weekStart, hoyISO, weekday } from '../js/util.js';
    import { construirPayload } from '../js/iphone.js';
    import { progresoDiario, mediaMovil, mejorRacha, resumenSemana, semanaPendiente, inicioHabito } from '../js/progreso.js';
    import { logrosCumplidos, LOGROS } from '../js/logros.js';
    import { barrasSVG, calendarioHTML } from '../js/grafica.js';
    import { normalizarPlan, cruzarConExistentes, unirFranjas, normalizarTurnos } from '../js/plan.js';
    import { interpretarTexto, tipoTurno } from '../js/interprete.js';
    import { entender } from '../js/agente.js';

    const lista = document.getElementById('lista');
    let ok = 0, ko = 0;
    function prueba(nombre, fn) {
      const li = document.createElement('li');
      try { fn(); li.className = 'ok'; li.textContent = `✓ ${nombre}`; ok++; }
      catch (e) { li.className = 'ko'; li.innerHTML = `✗ ${nombre}<pre>${e.message}</pre>`; ko++; console.error(nombre, e); }
      lista.appendChild(li);
    }
    const igual = (a, b, msg = '') => { if (a !== b) throw new Error(`${msg} esperado ${JSON.stringify(b)}, obtenido ${JSON.stringify(a)}`); };
    const cerca = (a, b, tol = 0.01, msg = '') => { if (Math.abs(a - b) > tol) throw new Error(`${msg} esperado ≈${b}, obtenido ${a}`); };
    const verdad = (c, msg) => { if (!c) throw new Error(msg); };

    // ---------- Finanzas ----------
    const base = {
      hoy: '2026-10-15', ingresos: { nomina: 1500, diaCobro: 1, extras: 0 },
      fixed: [{ id: 'f1', nombre: 'Alquiler', importe: 600, categoria: 'vivienda' }, { id: 'f2', nombre: 'Netflix', importe: 100, categoria: 'suscripciones', suscripcion: true }],
      expenses: [{ id: 'e1', importe: 100, categoria: 'supermercado', fecha: '2026-10-03' }, { id: 'e2', importe: 50, categoria: 'ocio', fecha: '2026-10-10' }],
      savingsGoals: [], contributions: [{ id: 'c1', goalId: 'm1', importe: 200, fecha: '2026-10-05' }], reto: null, sobrantesRepartidos: [], inicioApp: '2026-10-01',
    };

    prueba('Resumen del mes: disponible y €/día', () => {
      const r = resumenMes(base);
      igual(r.ingresos, 1500); igual(r.fijos, 700); igual(r.variables, 150); igual(r.aportado, 200);
      igual(r.disponible, 450, 'disponible');
      igual(r.diasRestantes, 17, 'días restantes');
      cerca(r.porDia, 450 / 17, 0.001, '€/día');
    });

    prueba('Regla 50/30/20 clasifica necesidades y caprichos', () => {
      const g = regla503020(base);
      igual(g.necesidades, 700, 'necesidades'); igual(g.deseos, 150, 'deseos');
      cerca(g.pct.ahorro, 200 / 1500 * 100, 0.01);
    });

    prueba('Meta sin aportaciones con fecha → atrasada y cuota mensual', () => {
      const m = { id: 'm9', nombre: 'Viaje', meta: 1000, fechaLimite: '2027-08-15', creado: '2026-10-15', prioridad: 2 };
      const e = estadoMeta(m, [], '2026-10-15');
      igual(e.estado, 'atrasado'); igual(e.ahorrado, 0); igual(e.pct, 0);
      cerca(e.necesarioMes, 1000 / (304 / 30.44), 1, 'necesario/mes');
    });

    prueba('Meta completada al llegar al 100 %', () => {
      const m = { id: 'm1', nombre: 'Moto', meta: 200, creado: '2026-10-01' };
      igual(estadoMeta(m, base.contributions, '2026-10-15').estado, 'completada');
    });

    prueba('Recomendación: categoría +40 % sobre la media de 3 meses', () => {
      const d = structuredClone(base);
      d.savingsGoals = [{ id: 'm2', nombre: 'Coche', meta: 6000, creado: '2026-06-01', prioridad: 3 }];
      d.contributions = [{ id: 'c', goalId: 'm2', importe: 300, fecha: '2026-09-01' }];
      for (const mes of ['2026-07', '2026-08', '2026-09']) d.expenses.push({ id: mes, importe: 100, categoria: 'restaurantes', fecha: `${mes}-10` });
      d.expenses.push({ id: 'r', importe: 140, categoria: 'restaurantes', fecha: '2026-10-12' });
      const rec = recomendaciones(d).find(r => r.titulo.startsWith('Restaurantes'));
      verdad(rec, 'no aparece la recomendación de Restaurantes');
      verdad(rec.titulo.includes('+40 %'), `título: ${rec.titulo}`);
      verdad(rec.texto.includes('480'), `ahorro anual en texto: ${rec.texto}`);
      verdad(/adelanta tu meta «Coche»|llegarías a tu meta «Coche»/.test(rec.texto), `sin adelanto de meta: ${rec.texto}`);
    });

    prueba('Recomendación: meta atrasada propone aportar', () => {
      const d = structuredClone(base);
      d.savingsGoals = [{ id: 'm3', nombre: 'Japón', meta: 3000, fechaLimite: '2027-04-15', creado: '2026-10-01', prioridad: 3 }];
      const rec = recomendaciones(d).find(r => r.accion?.tipo === 'aportar');
      verdad(rec && rec.titulo.includes('Japón'), 'no hay recomendación de aportar a Japón');
      verdad(rec.accion.importe > 0, 'importe a aportar');
    });

    prueba('Recomendación: suscripciones y fondo de emergencia', () => {
      const recs = recomendaciones(base);
      verdad(recs.some(r => r.titulo.includes('suscripciones')), 'falta suscripciones');
      const fondo = recs.find(r => r.accion?.tipo === 'crear-meta');
      verdad(fondo, 'falta fondo de emergencia');
      igual(fondo.accion.meta, 2100, 'fondo = 3 × fijos');
    });

    prueba('Recomendación: sobrante del mes anterior se reparte', () => {
      const d = structuredClone(base);
      d.inicioApp = '2026-09-01';
      d.savingsGoals = [{ id: 'a', nombre: 'A', meta: 5000, prioridad: 3, creado: '2026-09-01' }, { id: 'b', nombre: 'B', meta: 5000, prioridad: 1, creado: '2026-09-01' }];
      d.expenses.push({ id: 's', importe: 400, categoria: 'supermercado', fecha: '2026-09-10' });
      const rec = recomendaciones(d).find(r => r.accion?.tipo === 'repartir-sobrante');
      verdad(rec, 'no aparece el sobrante');
      const total = rec.accion.reparto.reduce((a, x) => a + x.importe, 0);
      igual(total, 400, 'reparto total (1500 − 700 − 400)');
      verdad(rec.accion.reparto[0].importe > rec.accion.reparto[1].importe, 'más a la meta prioritaria');
    });

    prueba('Sin nómina solo pide configurarla', () => {
      const d = structuredClone(base); d.ingresos.nomina = 0;
      const recs = recomendaciones(d);
      igual(recs.length, 1); igual(recs[0].accion.tipo, 'config-nomina');
    });

    prueba('Reto semanal: cumplido y roto', () => {
      const reto = { categoria: 'delivery', inicio: '2026-10-01', ahorroEstimado: 20 };
      igual(evaluarReto(reto, [], '2026-10-09').cumplido, true);
      igual(evaluarReto(reto, [{ categoria: 'delivery', importe: 12, fecha: '2026-10-03' }], '2026-10-05').roto, true);
      igual(evaluarReto(reto, [], '2026-10-04').terminado, false);
    });

    // ---------- Cerdito ----------
    prueba('Cerdito: etapas y escala', () => {
      [[0, 0], [0.19, 0], [0.2, 1], [0.45, 2], [0.6, 3], [0.85, 4], [0.999, 4], [1, 5], [1.5, 5]].forEach(([p, e]) => igual(etapa(p), e, `pct ${p}`));
      cerca(escala(0), 0.6); cerca(escala(1), 1.4); cerca(escala(2), 1.4); cerca(escala(0.5), 1.0);
    });

    // ---------- Horario ----------
    const lunes = addDays(weekStart(hoyISO()), 7);
    const disp = Array.from({ length: 7 }, () => [{ inicio: '18:00', fin: '22:00' }]);
    const prefs = { sesionMin: 60, descansoMin: 10, maxHorasDia: 3 };
    const settings = { importantes: 'alta' };
    const goals = [
      { id: 'A', titulo: 'Inglés', horasSemana: 4, prioridad: 3, momento: 'cualquiera' },
      { id: 'B', titulo: 'Leer', horasSemana: 2, prioridad: 1, momento: 'noche' },
    ];
    const minutos = (bs, id) => bs.filter(b => b.goalId === id).reduce((a, b) => a + toMin(b.fin) - toMin(b.inicio), 0);
    const sinSolapes = bs => {
      for (const a of bs) for (const b of bs) if (a !== b && a.fecha === b.fecha && toMin(a.inicio) < toMin(b.fin) && toMin(b.inicio) < toMin(a.fin)) return false;
      return true;
    };

    prueba('Generador: reparte todas las horas sin solapes y dentro de la disponibilidad', () => {
      const { nuevos, avisos } = generarSemana({ fecha: lunes, goals, blocks: [], disponibilidad: disp, prefs, settings });
      igual(minutos(nuevos, 'A'), 240, 'Inglés'); igual(minutos(nuevos, 'B'), 120, 'Leer');
      igual(avisos.length, 0, 'avisos');
      verdad(sinSolapes(nuevos), 'hay solapes');
      verdad(nuevos.every(b => toMin(b.inicio) >= toMin('18:00') && toMin(b.fin) <= toMin('22:00')), 'fuera de disponibilidad');
      verdad(nuevos.filter(b => b.goalId === 'A').every(b => b.importante), 'prioridad alta = alarma');
      verdad(nuevos.filter(b => b.goalId === 'B').every(b => toMin(b.inicio) >= 1140), 'Leer debería ir por la noche (≥19:00)');
    });

    prueba('Generador: respeta descansos y una sesión por objetivo y día', () => {
      const { nuevos } = generarSemana({ fecha: lunes, goals, blocks: [], disponibilidad: disp, prefs, settings });
      for (const a of nuevos) for (const b of nuevos) {
        if (a === b || a.fecha !== b.fecha || toMin(b.inicio) < toMin(a.fin)) continue;
        verdad(toMin(b.inicio) - toMin(a.fin) >= 10, `descanso insuficiente entre ${a.inicio}-${a.fin} y ${b.inicio}`);
      }
      const porDia = {};
      for (const b of nuevos) { const k = b.fecha + b.goalId; porDia[k] = (porDia[k] || 0) + 1; }
      verdad(Object.values(porDia).every(n => n === 1), 'repite objetivo el mismo día habiendo días libres');
    });

    prueba('Generador: no parte un hueco libre por la mitad', () => {
      const tarde = Array.from({ length: 7 }, () => [{ inicio: '18:00', fin: '21:30' }]);
      const { nuevos } = generarSemana({ fecha: lunes, goals: [{ id: 'L', titulo: 'Leer', horasSemana: 0.5, prioridad: 1, momento: 'noche', sesionMin: 30 }], blocks: [], disponibilidad: tarde, prefs, settings });
      igual(`${nuevos[0].inicio}-${nuevos[0].fin}`, '21:00-21:30', 'pegado al final del hueco y dentro de la noche');
    });

    prueba('Generador: a mitad de semana reparte solo la parte de los días que quedan', () => {
      const hoyT = hoyISO();
      const quedan = 7 - weekday(hoyT);
      const todoElDia = Array.from({ length: 7 }, () => [{ inicio: '00:00', fin: '23:59' }]);
      const { nuevos } = generarSemana({ fecha: hoyT, goals: [{ id: 'Z', titulo: 'Z', horasSemana: 7, prioridad: 2, sesionMin: 60 }], blocks: [], disponibilidad: todoElDia, prefs: { ...prefs, maxHorasDia: 24 }, settings });
      const min = minutos(nuevos, 'Z');
      verdad(min <= quedan * 60 && min >= (quedan - 1) * 60, `quedan ${quedan} días: ${min} min`);
    });

    prueba('Generador: avisa si no caben las horas', () => {
      const { avisos } = generarSemana({ fecha: lunes, goals: [{ id: 'X', titulo: 'Mucho', horasSemana: 40, prioridad: 2 }], blocks: [], disponibilidad: disp, prefs, settings });
      verdad(avisos.length === 1 && avisos[0].includes('Mucho'), JSON.stringify(avisos));
    });

    prueba('Generador: conserva los bloques fijados y los cuenta', () => {
      const fijo = { id: 'F', fecha: lunes, inicio: '18:00', fin: '20:00', titulo: 'Inglés', goalId: 'A', fijado: true };
      const suelto = { id: 'S', fecha: addDays(lunes, 1), inicio: '19:00', fin: '20:00', titulo: 'Viejo', goalId: 'B', fijado: false };
      const { nuevos, borrar } = generarSemana({ fecha: lunes, goals, blocks: [fijo, suelto], disponibilidad: disp, prefs, settings });
      verdad(!borrar.includes('F') && borrar.includes('S'), `borrar = ${borrar}`);
      igual(minutos(nuevos, 'A'), 120, 'Inglés restante tras 2 h fijadas');
      verdad(sinSolapes([...nuevos, fijo]), 'solapa con el fijado');
    });

    // ---------- Progreso ----------
    const blq = (fecha, hecho, goalId = 'A', inicio = '18:00', fin = '19:00') => ({ id: fecha + inicio + goalId, fecha, inicio, fin, titulo: 'x', goalId, hecho });

    prueba('Progreso diario: bloques + hábitos, y días vacíos sin dato', () => {
      const s = progresoDiario({
        blocks: [blq('2026-10-26', true), blq('2026-10-26', false, 'B')],
        habits: [{ id: 'h', titulo: 'Agua', registros: ['2026-10-26'], creado: '2026-10-26' }],
        tasks: [], desde: '2026-10-25', hasta: '2026-10-26', inicioApp: '2026-10-01',
      });
      igual(s.length, 2);
      igual(s[0].pct, null, 'día anterior al hábito y sin bloques');
      igual(s[1].planificados, 3); igual(s[1].hechos, 2); igual(s[1].pct, 67);
    });

    prueba('Progreso diario: las tareas suman sin pasar del 100 %', () => {
      const tasks = [{ id: 't1', hecho: true, hechoEn: '2026-10-26' }, { id: 't2', hecho: true, hechoEn: '2026-10-26' }, { id: 't3', hecho: false, hechoEn: '2026-10-26' }];
      const [d] = progresoDiario({ blocks: [blq('2026-10-26', true), blq('2026-10-26', false, 'B')], habits: [], tasks, desde: '2026-10-26', hasta: '2026-10-26' });
      igual(d.tareas, 2); igual(d.pct, 100);
      const [solo] = progresoDiario({ blocks: [], habits: [], tasks, desde: '2026-10-26', hasta: '2026-10-26' });
      igual(solo.pct, 100, 'día solo con tareas');
    });

    prueba('Hábitos antiguos sin fecha cuentan desde su primer registro', () => {
      igual(inicioHabito({ registros: ['2026-10-20', '2026-10-10'] }, '2026-09-01'), '2026-10-10');
      igual(inicioHabito({ registros: [] }, '2026-09-01'), '2026-09-01');
      igual(inicioHabito({ registros: ['2026-10-01'], creado: '2026-10-05' }, '2026-09-01'), '2026-10-01', 'día marcado antes de crearlo');
    });

    prueba('Media móvil ignora los huecos', () => {
      const m = mediaMovil([{ pct: 100 }, { pct: null }, { pct: 50 }, { pct: null }], 2);
      igual(JSON.stringify(m), '[100,100,50,50]');
      igual(mediaMovil([{ pct: null }])[0], null);
    });

    prueba('Mejor racha de un hábito', () => {
      igual(mejorRacha({ registros: ['2026-10-01', '2026-10-02', '2026-10-03', '2026-10-05', '2026-10-06', '2026-10-02'] }), 3);
      igual(mejorRacha({ registros: [] }), 0);
      igual(mejorRacha({ registros: ['2026-10-31', '2026-11-01'] }), 2, 'cambio de mes');
    });

    prueba('Resumen semanal: bloques, horas, hábitos, tareas y dinero', () => {
      const r = resumenSemana({
        goals: [{ id: 'A', titulo: 'Inglés', horasSemana: 2 }],
        blocks: [blq('2026-10-26', true), blq('2026-10-27', true), blq('2026-10-28', false), blq('2026-11-02', true)],
        habits: [{ id: 'h', titulo: 'Agua', emoji: '💧', registros: ['2026-10-26', '2026-10-27', '2026-11-03'], creado: '2026-10-26' }],
        tasks: [{ hecho: true, hechoEn: '2026-10-29' }, { hecho: true, hechoEn: '2026-11-05' }],
        expenses: [{ importe: 10.5, fecha: '2026-10-30' }, { importe: 99, fecha: '2026-11-03' }],
        contributions: [{ importe: 50, fecha: '2026-11-01' }], inicioApp: '2026-10-01',
      }, '2026-10-26');
      igual(r.domingo, '2026-11-01');
      igual(r.bloques.hechos, 2); igual(r.bloques.total, 3);
      igual(r.objetivos[0].horasHechas, 2); igual(r.objetivos[0].horasObjetivo, 2);
      igual(r.habitos[0].dias, 2); igual(r.tareas, 1);
      igual(r.gastado, 10.5); igual(r.ahorrado, 50);
      igual(r.mejorDia.pct, 100);
    });

    prueba('Resumen semanal a mitad de semana: los días que faltan no cuentan', () => {
      const r = resumenSemana({ hoy: '2026-10-27', goals: [], habits: [], tasks: [],
        blocks: [blq('2026-10-26', true), blq('2026-10-27', true), blq('2026-10-30', false)] }, '2026-10-26');
      igual(r.pct, 100); igual(r.bloques.total, 2);
    });

    prueba('Revisión semanal: domingo la semana actual, lunes a miércoles la anterior', () => {
      igual(semanaPendiente('2026-11-01', [], '2026-10-01'), '2026-10-26', 'domingo');
      igual(semanaPendiente('2026-11-02', [], '2026-10-01'), '2026-10-26', 'lunes');
      igual(semanaPendiente('2026-11-04', [], '2026-10-01'), '2026-10-26', 'miércoles');
      igual(semanaPendiente('2026-11-05', [], '2026-10-01'), null, 'jueves');
      igual(semanaPendiente('2026-11-02', [{ semana: '2026-10-26' }], '2026-10-01'), null, 'ya hecha');
      igual(semanaPendiente('2026-11-02', [], '2026-11-02'), null, 'app recién instalada');
    });

    prueba('Logros: se cumplen con los datos justos', () => {
      const vacio = { hoy: '2026-10-29', blocks: [], habits: [], tasks: [], goals: [], savingsGoals: [], contributions: [], revisiones: [], serie: [] };
      igual(logrosCumplidos(vacio).length, 0, 'sin datos');
      const d = { ...vacio,
        blocks: [blq('2026-10-26', true), blq('2026-10-26', true, 'B')],
        contributions: [{ goalId: 'm', importe: 120, fecha: '2026-10-01' }],
        savingsGoals: [{ id: 'm', nombre: 'Moto', meta: 100, creado: '2026-09-01' }],
        habits: [{ registros: ['2026-10-01', '2026-10-02', '2026-10-03', '2026-10-04', '2026-10-05', '2026-10-06', '2026-10-07'] }],
      };
      d.serie = progresoDiario({ blocks: d.blocks, desde: '2026-10-26', hasta: '2026-10-26' });
      const ids = logrosCumplidos(d);
      for (const id of ['primer-paso', 'dia-perfecto', 'ahorro-100', 'meta-cumplida', 'racha-7']) verdad(ids.includes(id), `falta ${id}: ${ids}`);
      for (const id of ['bloques-10', 'ahorro-500', 'racha-30']) verdad(!ids.includes(id), `sobra ${id}`);
      igual(new Set(LOGROS.map(l => l.id)).size, LOGROS.length, 'ids repetidos');
    });

    prueba('Gráfica y calendario se dibujan', () => {
      const s = progresoDiario({ blocks: [blq('2026-10-26', true), blq('2026-10-27', false)], habits: [], tasks: [], desde: '2026-10-21', hasta: '2026-10-27' });
      const svg = barrasSVG(s, { linea: mediaMovil(s) });
      igual((svg.match(/<rect/g) || []).length, 2, 'una barra por día con datos');
      verdad(svg.includes('g-barra alta') && svg.includes('g-barra baja'), 'colores por nivel');
      verdad(svg.includes('class="g-linea"'), 'línea de media');
      const cal = calendarioHTML('2026-10', new Set(['2026-10-05']));
      igual((cal.match(/data-dia=/g) || []).length, 31);
      verdad(/class="cal-dia on[^"]*"\s+data-dia="2026-10-05"/.test(cal), 'día marcado');
    });

    // ---------- Plan a partir del texto ----------
    prueba('Plan: limpia horas, días y franjas solapadas', () => {
      const p = normalizarPlan({ disponibilidad: [
        { dia: 0, inicio: '18:00', fin: '20:00' }, { dia: 0, inicio: '19:30', fin: '21:00' }, { dia: 0, inicio: '7:00', fin: '8:00' },
        { dia: 1, inicio: '22:00', fin: '21:00' }, { dia: 9, inicio: '10:00', fin: '11:00' }, { dia: 2, inicio: '25:00', fin: '26:00' },
      ] });
      igual(JSON.stringify(p.disponibilidad[0]), '[{"inicio":"07:00","fin":"08:00"},{"inicio":"18:00","fin":"21:00"}]');
      igual(p.disponibilidad[1].length, 0, 'fin antes que inicio'); igual(p.disponibilidad[2].length, 0, 'hora imposible');
      igual(p.disponibilidad.length, 7);
      igual(normalizarPlan({ disponibilidad: [] }).disponibilidad, null, 'sin franjas no toca la disponibilidad');
      igual(unirFranjas([{ inicio: '10:00', fin: '11:00' }, { inicio: '11:00', fin: '12:00' }]).length, 1, 'franjas que se tocan');
    });

    prueba('Plan: objetivos válidos, sin duplicados y con valores dentro de rango', () => {
      const p = normalizarPlan({ objetivos: [

    prueba('Plan: dinero solo si hay cifras y perfil sin campos vacíos', () => {

    prueba('Plan: reconoce lo que ya existe para actualizarlo en vez de duplicarlo', () => {
      const p = cruzarConExistentes(normalizarPlan({ objetivos: [{ titulo: 'Leer más', area: 'personal', horasSemana: 2 }, { titulo: 'Correr', area: 'salud', horasSemana: 2 }],

      igual(p.objetivos[0].existente, 'g1'); igual(p.objetivos[1].existente, null, 'archivado no cuenta');
      igual(p.habitos[0].existente, 'h1'); igual(p.metasAhorro[0].existente, 's1');
    });

    // ---------- Intérprete de texto (sin IA) ----------
    const HOY_T = '2026-10-29'; // jueves
    const TEXTO_AMAZON = 'Trabajo en Amazon turnos rotativos dos semanas turno de tarde de 14:50 a 22:55, y por las mañanas de 6:40 a 14:50 trabajo de viernes a martes mañana empiezo por la mañana me queda una semana de turno de mañanas me gustaría en el tiempo que tengo libre a mejorar mis conocimientos informáticos pero de una forma poco a poco para no rallarme';
    const TEXTO_OFICINA = `Me llamo Dani, tengo 24 años y trabajo de lunes a viernes de 9:00 a 17:00 en una oficina; tardo 30 minutos en llegar. Me levanto a las 7:00 y me acuesto sobre las 23:30. Los martes y jueves tengo clase de guitarra de 19:00 a 20:00.
Quiero ir al gimnasio 3 veces por semana por la mañana, sacarme el B2 de inglés antes de junio y leer más. Me cuesta ser constante y pierdo mucho tiempo con el móvil por la noche.
Cobro 1.500 € al mes el día 28, pago 550 € de alquiler y quiero ahorrar 2.000 € para un viaje a Japón en verano.`;
    const dentroDe = (franjas, desde, hasta) => franjas.every(f => toMin(f.inicio) >= toMin(desde) && toMin(f.fin) <= toMin(hasta));

    prueba('Intérprete: entiende los turnos rotativos del texto de Amazon', () => {
      const { turnos } = interpretarTexto(TEXTO_AMAZON, { hoy: HOY_T });
      verdad(turnos, 'no detecta los turnos');
      igual(JSON.stringify(turnos.horarios.tarde), '{"inicio":"14:50","fin":"22:55"}');
      igual(JSON.stringify(turnos.horarios.manana), '{"inicio":"06:40","fin":"14:50"}');
      igual(turnos.inicioCiclo, 4, 'el ciclo empieza en viernes');
      igual(turnos.patron.filter(x => x === 'tarde').length, 2, 'dos semanas de tarde');
      igual(tipoTurno(turnos, '2026-10-29'), 'tarde', 'hoy (jueves) sigue en el ciclo de tarde');
      igual(tipoTurno(turnos, '2026-10-30'), 'manana', 'mañana viernes empieza el turno de mañana');
      igual(tipoTurno(turnos, '2026-11-03'), 'manana', 'el martes sigue de mañana');
      igual(tipoTurno(turnos, '2026-11-06'), 'tarde', 'el viernes siguiente vuelve a tarde');
      igual(tipoTurno(turnos, '2026-11-13'), 'tarde', 'segunda semana de tarde');
      igual(tipoTurno(turnos, '2026-11-20'), 'manana', 'y otra vez mañana (1 semana de mañana, 2 de tarde)');
    });

    prueba('Intérprete: horas libres de cada turno sin trabajo, trayecto ni comidas', () => {
      const { turnos } = interpretarTexto(TEXTO_AMAZON, { hoy: HOY_T });
      const { tarde, manana } = turnos.disponibilidad;
      verdad(tarde[4].length && dentroDe(tarde[4], '07:00', '14:05'), `viernes de tarde: ${JSON.stringify(tarde[4])}`);
      verdad(manana[4].length && dentroDe(manana[4], '15:20', '23:59'), `viernes de mañana: ${JSON.stringify(manana[4])}`);
      for (const d of [0, 1, 4, 5, 6]) verdad(!tarde[d].some(f => toMin(f.fin) > toMin('14:05')), `día ${d} de tarde choca con el trabajo`);
      const libre = f => f.reduce((a, x) => a + toMin(x.fin) - toMin(x.inicio), 0);
      verdad(libre(tarde[2]) > libre(tarde[4]), 'el miércoles (libra) tiene más tiempo libre que un día de trabajo');
    });

    prueba('Intérprete: objetivo de informática, poco a poco', () => {
      const r = interpretarTexto(TEXTO_AMAZON, { hoy: HOY_T });
      const o = r.raw.objetivos;
      igual(o.length, 1, JSON.stringify(o.map(x => x.titulo)));
      igual(o[0].titulo, 'Mejorar mis conocimientos de informática');
      verdad(o[0].horasSemana <= 2, `horas: ${o[0].horasSemana}`);
      igual(o[0].sesionMin, 30, 'sesiones cortas');
      verdad(r.raw.preferencias.maxHorasDia <= 1.5, 'poco cada día');
      verdad(r.supuestos.some(s => s.includes('30 minutos')), 'avisa de que ha supuesto el trayecto');
      verdad(normalizarTurnos(r.turnos), 'los turnos pasan la validación');
    });

    prueba('Intérprete: texto con horario fijo, objetivos, hábitos y dinero', () => {
      const r = interpretarTexto(TEXTO_OFICINA, { hoy: HOY_T });
      igual(r.turnos, null, 'no hay turnos');
      const o = Object.fromEntries(r.raw.objetivos.map(x => [x.titulo, x]));
      verdad(o['Ir al gimnasio'] && o['Sacarme el B2 de inglés'] && o['Leer más'], JSON.stringify(Object.keys(o)));
      igual(o['Ir al gimnasio'].horasSemana, 3, '3 veces × 1 h'); igual(o['Ir al gimnasio'].momento, 'manana');
      igual(o['Sacarme el B2 de inglés'].fechaLimite, '2027-05-31', 'antes de junio');
      igual(o['Leer más'].momento, 'noche');
      igual(o['Ir al gimnasio'].prioridad, 3, 'lo primero que dice, prioridad alta');
      igual(r.raw.ingresos.nomina, 1500); igual(r.raw.ingresos.diaCobro, 28);
      igual(r.raw.gastosFijos[0]?.nombre, 'Alquiler'); igual(r.raw.gastosFijos[0]?.importe, 550);
      igual(r.raw.metasAhorro[0]?.nombre, 'Viaje a Japón'); igual(r.raw.metasAhorro[0]?.meta, 2000); igual(r.raw.metasAhorro[0]?.fechaLimite, '2027-06-21');
      igual(r.raw.perfil.nombre, 'Dani');
      verdad(r.raw.habitos.some(h => h.emoji === '📵') && r.raw.habitos.some(h => h.emoji === '✅'), JSON.stringify(r.raw.habitos));
      const lunes = r.raw.disponibilidad.filter(f => f.dia === 0), martes = r.raw.disponibilidad.filter(f => f.dia === 1);
      verdad(!lunes.some(f => toMin(f.fin) > toMin('08:15') && toMin(f.inicio) < toMin('17:30')), `lunes choca con el trabajo: ${JSON.stringify(lunes)}`);
      verdad(!martes.some(f => toMin(f.inicio) < toMin('20:15') && toMin(f.fin) > toMin('18:45')), `martes choca con la guitarra: ${JSON.stringify(martes)}`);
    });

    prueba('Intérprete: correcciones escritas con tus palabras', () => {
      const r = interpretarTexto(TEXTO_OFICINA, { hoy: HOY_T, ajustes: ['el gimnasio mejor por la tarde', 'quita leer', 'me levanto a las 6'] });

      igual(r.raw.objetivos.find(x => x.titulo === 'Ir al gimnasio').momento, 'tarde');
      verdad(r.raw.disponibilidad.some(f => f.dia === 5 && toMin(f.inicio) <= toMin('06:50')), 'el sábado empieza antes al levantarse a las 6');
    });

    prueba('Intérprete: horas escritas con palabras y objetivos fuera del catálogo', () => {
      const r = interpretarTexto('Trabajo de lunes a viernes de 8 y media a 3 de la tarde. Me gustaría aprender a cocinar platos sanos y 2 horas a la semana de inglés', { hoy: HOY_T });

      const t = r.raw.objetivos.map(x => x.titulo);

    });

    // Textos de personas muy distintas: lo importante es que no se coloque nada encima de sus obligaciones.
    const persona = texto => {
      const r = interpretarTexto(texto, { hoy: HOY_T });
      const dia = n => r.raw.disponibilidad.filter(f => f.dia === n);
      const choca = (n, a, b) => dia(n).some(f => toMin(f.inicio) < toMin(b) && toMin(f.fin) > toMin(a));
      return { r, dia, choca, entendido: r.entendido.join(' '), objetivos: r.raw.objetivos.map(o => o.titulo) };
    };

    prueba('Personas: estudiante con clases y fútbol', () => {
      const p = persona('Soy estudiante de 2º de bachillerato. Tengo clases de lunes a viernes de 8:00 a 14:30. Los martes y jueves voy a fútbol de 18:00 a 19:30. Quiero sacar buena nota en selectividad y aprender a programar. Me acuesto a las 23:00.');

      verdad(p.objetivos.includes('Preparar la selectividad') && p.objetivos.includes('Aprender a programar'), p.objetivos);
    });

    prueba('Personas: jornada partida', () => {
      const p = persona('Trabajo en una tienda de lunes a sábado de 10 a 14 y de 17 a 21. Los domingos libro. Quiero ir al gimnasio 3 veces por semana y leer antes de dormir.');
      verdad(p.entendido.includes('de 10:00 a 14:00 y de 17:00 a 21:00'), p.entendido);
      verdad(!p.choca(0, '09:30', '14:30') && !p.choca(0, '16:30', '21:30'), JSON.stringify(p.dia(0)));

    prueba('Personas: turno de noche', () => {
      const p = persona('Trabajo de noche de 22:00 a 6:00 de lunes a viernes. Duermo por la mañana hasta las 14:00. Quiero aprender inglés.');

      verdad(p.dia(0).length && p.dia(0).every(f => toMin(f.inicio) >= toMin('14:00') && toMin(f.fin) <= toMin('21:15')), JSON.stringify(p.dia(0)));
      verdad(!p.choca(5, '06:00', '13:30'), `el sábado duerme tras el turno del viernes: ${JSON.stringify(p.dia(5))}`);
    });

    prueba('Personas: con hijos y teletrabajo', () => {
      const p = persona('Tengo dos hijos. Los llevo al cole a las 9 y los recojo a las 16:30. Trabajo desde casa de 9:30 a 15:30. Me gustaría hacer deporte y aprender a cocinar.');
      verdad(p.entendido.includes('Llevar a los niños') && p.entendido.includes('Recoger a los niños'), p.entendido);
      verdad(!p.choca(0, '16:10', '16:55'), JSON.stringify(p.dia(0)));

    });

    prueba('Personas: horario distinto cada día', () => {
      const p = persona('Los lunes y miércoles trabajo de 8 a 15, los martes y jueves de 14 a 21 y los viernes de 8 a 13. Quiero estudiar oposiciones 10 horas a la semana.');
      verdad(p.entendido.includes('los martes y jueves de 14:00 a 21:00') && p.entendido.includes('los viernes de 08:00 a 13:00'), p.entendido);
      verdad(!p.choca(1, '13:00', '21:30') && !p.choca(0, '07:15', '15:30'), JSON.stringify([p.dia(0), p.dia(1)]));
      igual(p.r.raw.objetivos[0]?.horasSemana, 10);
    });

    prueba('Personas: sin trabajo', () => {
      const p = persona('Ahora mismo no trabajo. Me levanto a las 9. Quiero buscar trabajo, aprender inglés y hacer ejercicio.');
      verdad(p.objetivos.includes('Encontrar trabajo'), p.objetivos);
      verdad(p.dia(0).some(f => toMin(f.inicio) < toMin('12:00')), 'tiene mañanas libres');
      verdad(!p.r.supuestos.some(s => s.includes('horario general')), 'no le aplica el horario de alguien que trabaja');
    });

    prueba('Generador: pone las sesiones de un objetivo a la misma hora cada día', () => {
      const disp = Array.from({ length: 7 }, (_, d) => (d % 2 ? [{ inicio: '10:00', fin: '12:00' }, { inicio: '17:00', fin: '22:00' }] : [{ inicio: '17:00', fin: '22:00' }]));
      const { nuevos } = generarSemana({ fecha: lunes, goals: [{ id: 'R', titulo: 'R', horasSemana: 4, prioridad: 2, sesionMin: 60 }], blocks: [], disponibilidad: disp, prefs, settings });
      igual(new Set(nuevos.map(b => b.inicio)).size, 1, `horas distintas: ${nuevos.map(b => b.fecha.slice(8) + ' ' + b.inicio)}`);
    });

    prueba('Turnos: el generador usa las horas libres del turno de cada semana', () => {
      const turnos = { rotativo: true, patron: ['manana', 'tarde'], referencia: lunes, inicioCiclo: 0,
        disponibilidad: { manana: Array.from({ length: 7 }, () => [{ inicio: '18:00', fin: '20:00' }]), tarde: Array.from({ length: 7 }, () => [{ inicio: '09:00', fin: '11:00' }]) } };
      const disp = f => turnos.disponibilidad[tipoTurno(turnos, f)];
      const g = [{ id: 'A', titulo: 'X', horasSemana: 2, prioridad: 2 }];
      const s1 = generarSemana({ fecha: lunes, goals: g, blocks: [], disponibilidad: disp, prefs, settings }).nuevos;
      const s2 = generarSemana({ fecha: addDays(lunes, 7), goals: g, blocks: [], disponibilidad: disp, prefs, settings }).nuevos;
      verdad(s1.length && s1.every(b => b.inicio >= '18:00'), `semana de mañana: ${s1.map(b => b.inicio)}`);
      verdad(s2.length && s2.every(b => b.fin <= '11:00'), `semana de tarde: ${s2.map(b => b.inicio)}`);
    });

    // ---------- Asistente: entiende las órdenes ----------
    prueba('Asistente: reconoce cada tipo de orden', () => {
      const casos = [
        ['¿Qué me toca hoy?', 'dia'], ['¿y mañana?', 'dia'], ['hola', 'dia'],
        ['Ya he hecho informática', 'hecho'], ['he bebido agua', 'hecho'], ['listo', 'hecho'],
        ['hoy no puedo', 'mover'], ['pásalo a mañana', 'mover'], ['mueve inglés al viernes a las 18', 'mover'],
        ['retrasa 30 minutos', 'retrasar'], ['cancela el gimnasio', 'cancelar'],
        ['añade 1 hora de inglés el sábado a las 10', 'anadir'], ['pasado mañana pon media hora de lectura', 'anadir'],
        ['hoy tengo libre de 5 a 8', 'libre'], ['mañana libro', 'libre'], ['el sábado trabajo de 9 a 14', 'ocupado'],
        ['esta semana estoy de tarde', 'turno'], ['me han cambiado el turno a mañana', 'turno'],
        ['he gastado 5 € en café', 'gasto'], ['aparto 20 € para el viaje', 'ahorro'],
        ['no tengo ganas', 'animo'], ['¿cómo voy?', 'progreso'], ['reorganiza mi semana', 'replanificar'],
        ['quiero empezar a correr', 'objetivo'], ['ayuda', 'ayuda'], ['gracias', 'gracias'], ['asdfgh', 'desconocido'],
      ];
      const mal = casos.filter(([frase, tipo]) => entender(frase, HOY_T).tipo !== tipo).map(([frase, tipo]) => `«${frase}» → ${entender(frase, HOY_T).tipo} (esperado ${tipo})`);
      verdad(!mal.length, mal.join('\n'));
    });

    prueba('Asistente: saca días, horas, duraciones y dinero', () => {
      let o = entender('mueve inglés al viernes a las 18', HOY_T);
      igual(o.fecha, '2026-10-30'); igual(o.hora, '18:00');
      o = entender('pásalo a mañana', HOY_T); igual(o.fecha, '2026-10-30', 'mañana = día siguiente');
      o = entender('pasado mañana pon media hora de lectura', HOY_T); igual(o.fecha, '2026-10-31'); igual(o.duracion, 30);
      o = entender('añade 1 hora de inglés el sábado a las 10', HOY_T); igual(o.fecha, '2026-10-31'); igual(o.duracion, 60); igual(o.hora, '10:00');
      o = entender('hoy tengo libre de 5 a 8', HOY_T); igual(JSON.stringify(o.rango), '{"inicio":"17:00","fin":"20:00"}', '«de 5 a 8» es por la tarde');
      o = entender('el sábado trabajo de 9 a 14', HOY_T); igual(JSON.stringify(o.rango), '{"inicio":"09:00","fin":"14:00"}');
      o = entender('esta semana estoy de tarde', HOY_T); igual(o.turno, 'tarde'); igual(o.siguiente, false);
      o = entender('la semana que viene me toca turno de mañana', HOY_T); igual(o.turno, 'manana'); igual(o.siguiente, true);
      o = entender('he gastado 4,50 € en café', HOY_T); igual(o.importe, 4.5); igual(o.categoria, 'cafe');
      o = entender('me he gastado 32 euros en la compra del mercadona', HOY_T); igual(o.categoria, 'supermercado');
      o = entender('retrasa el inglés una hora', HOY_T); igual(o.duracion, 60);
    });

    // ---------- Otros ----------
    prueba('Envío al Atajo: formato del JSON', () => {

      verdad(p.bloques[0].etiquetaAlarma.startsWith('MMV · Inglés'), p.bloques[0].etiquetaAlarma);
    });

    prueba('Markdown: listas anidadas y escapado de HTML', () => {

    });

      igual(weekStart('2026-10-29'), '2026-10-26');
    });

    document.getElementById('resumen').innerHTML = ko ? `<span class="ko">${ko} fallos</span> · ${ok} correctas` : `<span class="ok">✅ ${ok} pruebas correctas</span>`;
    document.title = ko ? `FALLOS ${ko}` : `OK ${ok}`;
